# ServiceMonitors for the three non-Boutique metric sources
# -----------------------------------------------------------------------------
# The 11 Boutique services have no /metrics endpoint (verified across the
# vendored upstream v0.10.7 tree), so the only workload metrics that exist are
# the ones these three sources produce plus kube-state-metrics, node-exporter
# and cAdvisor, which the kube-prometheus-stack chart already scrapes.
#
# ALL THREE carry `release: kube-prometheus-stack`. The Prometheus Operator's
# serviceMonitorSelector defaults to `{release: <release name>}`
# (serviceMonitorSelectorNilUsesHelmValues: true), so a ServiceMonitor without
# that label is silently ignored — which is why the TargetDown alert in
# observability/rules/boutique-alerts.yaml uses `absent(up{job="traefik"})`
# rather than `up == 0`: no series at all is the symptom of this mistake.
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: traefik
  namespace: observability
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: boutique-platform
    platform.boutique/source: edge
spec:
  # `job` will be "traefik", not "serviceMonitor/kube-system/traefik-metrics/0",
  # because jobLabel points at a Service label rather than letting the operator
  # synthesise a name. That is what makes `up{job="traefik"}` in the TargetDown
  # alert readable rather than a spelunking exercise.
  jobLabel: app.kubernetes.io/name

  # Traefik is deployed by this repo, into namespace `traefik`, not the
  # kube-system that k3s's bundled Traefik would use.
  #
  # MEASURED 2026-10-16: this block said `kube-system` until today, and it was
  # wrong the day it was written. `platform/nodes.tf` starts k3s with
  # `--disable traefik` and `scripts/deploy-workloads.sh` installs the chart
  # with `-n traefik`, so there has never been a Traefik in kube-system -- a
  # namespaceSelector that names a namespace which does not exist selects
  # nothing. Two more mismatches stacked behind it (the instance label, and a
  # port that existed on the pod but on no Service), and the result was a
  # monitor that scraped nothing at all while `TargetDown` paged from its
  # `absent()` branch. See cluster/traefik/values.yaml for the port, and the
  # next block for the label.
  namespaceSelector:
    matchNames:
      - traefik

  # The chart's own Service. The instance label is what the selector missed
  # for the same reason: the traefik chart's `_helpers.tpl` composes it as
  # `<release>-<chart>`, which for this release is `traefik-traefik`, not the
  # bare `traefik` a reader would assume. Verified against the live object:
  #   kubectl get svc traefik -n traefik -o jsonpath='{.metadata.labels}'
  #   -> {"app.kubernetes.io/instance":"traefik-traefik",
  #       "app.kubernetes.io/name":"traefik", ...}
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
      app.kubernetes.io/instance: traefik-traefik

  endpoints:
    # `port: metrics` binds to the NAME of a port on the selected Service, not to
    # a number. That is deliberate, and the note about which number it is was
    # itself wrong until 2026-10-16: it claimed the rancher build might use
    # 8082, on the strength of k3s's bundled manifests. The chart we actually
    # install sets `prometheus.io/port: "9100"` on its pods (verified on the
    # live pod), and 9100 is also the containerPort named `metrics`. Binding
    # by name means the monitor survives either number being changed in the
    # chart, which is the property the old note wanted for a reason it had not
    # verified.
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      # Traefik's metrics endpoint serves the full registry on one connection;
      # honorLabels would let a relabelled series through unmerged. Left off
      # (the default) so two series with the same name and labels are merged
      # rather than duplicated.
