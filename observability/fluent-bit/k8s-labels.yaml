apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-k8s-labels
  namespace: observability
  labels:
    app.kubernetes.io/name: fluent-bit
data:
  k8s-labels.lua: |
    -- Fluent Bit — the Kubernetes→label copy, in Lua
    -- -----------------------------------------------------------------------------
    -- Observability/fluent-bit/values.yaml step 7 needs four values out of the
    -- `kubernetes` map that the kubernetes filter attaches to every record:
    -- `namespace_name`, `container_name`, `pod_name` and `labels["app"]`. They are
    -- read by Lua because the `modify` filter cannot read record accessors in
    -- fluent-bit 5.1.3 — measured live 2026-10-15, not assumed.
    -- 
    -- THE MEASUREMENT, IN FULL, BECAUSE IT COST AN HOUR
    -- ------------------------------------------------
    -- The pipeline was fully working and fully wrong at the same time: records were
    -- parsed correctly (the step-2 rewrite_tag rules matched `app`, and the step-3
    -- parsers produced `message`), yet every stream in Loki landed as
    -- {namespace="unknown", app="unlabelled", container="unknown", service_name="unlabelled"}
    -- A probe DaemonSet with a stdout output showed why: the record carried a
    -- complete `kubernetes` map while all four label keys were missing, because the
    -- four `modify` lines that were supposed to copy them are no-ops. The same
    -- probe tested the exact behaviours, so there is no guessing left:
    -- 
    -- Set probe $stream                -> wrote the 7 characters "$stream"
    -- Set probe $kubernetes['x']       -> wrote the literal "$kubernetes['x']"
    -- Copy stream probe                -> worked ("stderr")
    -- Copy $kubernetes['namespace_name'] probe -> absent (nothing copied)
    -- 
    -- `rewrite_tag` resolves record accessors in its Rule keys, which is why the
    -- routing and the parsers never showed the problem; `modify` does not resolve
    -- them in `Set` or `Copy` at all in this version. The `Add` fallbacks below
    -- then quietly filled the gap with the sentinel strings, so nothing failed
    -- loudly — a pipeline can be green and wrong at once.
    -- 
    -- WHAT THIS FUNCTION GUARANTEES
    -- -----------------------------
    -- * Reads the record's own `kubernetes` map; nothing is fetched.
    -- * Copies ONLY when the destination key is absent, so a value set upstream
    -- (or by a future filter) is never overwritten, and the `Add ... unlabelled`
    -- sentinels in step 7 still mean "missing" rather than "wrong".
    -- * Returns record unchanged when the map is absent, which happens for a line
    -- written before the kubernetes filter started.
    -- 
    -- It is mounted at /fluent-bit/etc/lua/k8s-labels.lua from the ConfigMap
    -- `fluent-bit-k8s-labels`, declared in the chart's `daemonSetVolumes`. A plain
    -- file, not a Helm value, for the same reason the parsers are: this is the file
    -- an on-call engineer edits, and "grep the k8s copy" has to resolve to one path.
    function set_k8s_labels(tag, timestamp, record)
      local k8s = record["kubernetes"]
      if type(k8s) ~= "table" then
        return 1, timestamp, record
      end
      local labels = k8s["labels"] or {}
      if record["ns_label"] == nil then
        record["ns_label"] = k8s["namespace_name"]
      end
      if record["app_label"] == nil then
        record["app_label"] = labels["app"]
      end
      if record["container_label"] == nil then
        record["container_label"] = k8s["container_name"]
      end
      if record["pod_name"] == nil then
        record["pod_name"] = k8s["pod_name"]
      end
      return 1, timestamp, record
    end
