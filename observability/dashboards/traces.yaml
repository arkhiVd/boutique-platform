# Traces dashboard — spanmetrics RED, the Tempo service graph, and a checkout waterfall
# -----------------------------------------------------------------------------
# Provisioned by the kube-prometheus-stack Grafana sidecar (label
# `grafana_dashboard: "1"`), the same mechanism as the other four dashboards in
# this directory — a bare .json file cannot carry that label, and the sidecar
# reads ConfigMaps, not files.
#
# Phase 11's exit criteria live on this board:
#   - the service graph renders dependencies (nodeGraph panel, Tempo datasource
#     serviceMap -> Prometheus, fed by Tempo's service-graphs processor)
#   - RED per service in Prometheus from the collector's spanmetrics connector
#     (span:request_rate:ratio / span:error_ratio:ratio / span:latency_p95:seconds
#     in observability/rules/spanmetrics.yaml)
#   - a checkout trace waterfall (TraceQL panel, same query the runbook's curl
#     uses)
# Every panel description names the rule or metric it reads, so a screenshot can
# be checked against the repo rather than believed.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traces
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: boutique-platform
    platform.boutique/dashboard: traces
data:
  traces.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "title": "Traces \u2014 spanmetrics RED and the Tempo service graph",
      "uid": "boutique-traces",
      "version": 1,
      "tags": [
        "boutique-platform",
        "traces",
        "tempo",
        "spanmetrics"
      ],
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "description": "Phase 11 traces layer. Sources: traces_span_metrics_* from the OTel Collector's spanmetrics connector (scraped on :9464), traces_service_graph_* from Tempo's metrics generator (remote-written to Prometheus), and Tempo itself for the trace list and waterfall. Rule names are in each panel description so every line is checkable.",
      "templating": {
        "list": [
          {
            "name": "service",
            "label": "Boutique service",
            "type": "custom",
            "definition": "frontend,checkoutservice,productcatalogservice,currencyservice,emailservice,adservice,shippingservice,paymentservice,recommendationservice,cartservice",
            "query": "frontend,checkoutservice,productcatalogservice,currencyservice,emailservice,adservice,shippingservice,paymentservice,recommendationservice,cartservice",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Service graph \u2014 where did the request go",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "nodeGraph",
          "title": "Service graph (Tempo metrics generator \u2192 Prometheus)",
          "description": "Dependency graph built from paired client/server spans. Edges come from traces_service_graph_request_total / _failed_total / _server_seconds, generated by Tempo's service-graphs processor (observability/tempo/values.yaml, service-graphs only \u2014 spanmetrics is the collector's) and remote-written into Prometheus. The panel queries them through the Tempo datasource's serviceMap link to uid `prometheus`; an empty graph means the metrics generator is not remote-writing, and the first check is `kubectl -n observability logs deploy/tempo | grep -i remote`.",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "gridPos": {
            "h": 11,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "queryType": "serviceMap",
              "refId": "A"
            }
          ],
          "options": {
            "nodes": {
              "mainStat": "rate (req/s)",
              "secondaryStat": "error rate",
              "arc__failed": "failed",
              "arc__total": "total"
            },
            "edges": {
              "mainStat": "rate (req/s)",
              "secondaryStat": "p95 (s)"
            }
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Edge vs process request rate (the cross-check)",
          "description": "Two independent views of the same traffic: job:request_rate:ratio from Traefik's edge metrics, and span:request_rate:ratio from server spans. They should track each other. Edge flat + spans flowing means traffic is not reaching Traefik; edge flowing + spans flat means the OTLP path into the collector is broken (see docs/runbooks/traces.md).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 11,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "expr": "job:request_rate:ratio{job=~\"$service\"}",
              "legendFormat": "edge {{job}}",
              "refId": "A"
            },
            {
              "expr": "span:request_rate:ratio{job=~\"$service\"}",
              "legendFormat": "span {{job}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": [
                "mean",
                "max"
              ]
            }
          }
        },
        {
          "type": "row",
          "title": "RED from spans \u2014 per service",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 12
          }
        },
        {
          "type": "timeseries",
          "title": "Request rate (server spans)",
          "description": "span:request_rate:ratio \u2014 rate(traces_span_metrics_calls_total{span_kind=\"SPAN_KIND_SERVER\"}) per service, produced pre-sampling so it is a true rate and not a sampled one.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 13
          },
          "targets": [
            {
              "expr": "span:request_rate:ratio{job=~\"$service\"}",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": [
                "mean",
                "max"
              ]
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Error ratio (OTel span status ERROR)",
          "description": "span:error_ratio:ratio \u2014 spans with status_code=STATUS_CODE_ERROR over all server spans. Unlike the Traefik 5xx ratio this counts application-level failures that never became an HTTP 5xx, which is exactly what the checkout payment-failure path produces.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 13
          },
          "targets": [
            {
              "expr": "span:error_ratio:ratio{job=~\"$service\"}",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.01
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": [
                "mean",
                "max"
              ]
            }
          }
        },
        {
          "type": "timeseries",
          "title": "p95 latency (server spans)",
          "description": "span:latency_p95:seconds from traces_span_metrics_duration_seconds_bucket. The buckets are the same ladder as Traefik's custom buckets (0.05 ... 10s), so this p95 and the edge p95 are measured with the same resolution.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 13
          },
          "targets": [
            {
              "expr": "span:latency_p95:seconds{job=~\"$service\"}",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": [
                "mean",
                "max"
              ]
            }
          }
        },
        {
          "type": "row",
          "title": "Trace waterfall \u2014 the checkout request",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 21
          }
        },
        {
          "type": "traces",
          "title": "Recent checkoutservice traces",
          "description": "TraceQL search against Tempo (/api/search): every recent trace containing a checkoutservice server span, newest first. Click a row for the waterfall \u2014 the SPEC acceptance criterion is a checkout trace spanning frontend \u2192 checkoutservice \u2192 paymentservice, and an EXTRA_LATENCY=3s injection shows up here as a visibly stretched span (docs/chaos-experiments.md). The query is deliberately TraceQL, not a link: it is the same query the runbook's curl uses, so a screenshot and a command can be diffed.",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "gridPos": {
            "h": 8,
            "w": 16,
            "x": 0,
            "y": 22
          },
          "targets": [
            {
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "queryType": "traceql",
              "query": "{ resource.service.name = \"checkoutservice\" && status = ok }",
              "limit": 20,
              "refId": "A"
            }
          ],
          "options": {}
        },
        {
          "type": "traces",
          "title": "Recent ERROR traces (all services)",
          "description": "Traces containing at least one span with status ERROR \u2014 the tail-sampling policy keeps 100% of these regardless of the 10% baseline, so this list is complete even when the sampled success list above is not. This is the panel to open when span:error_ratio:ratio moves.",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 22
          },
          "targets": [
            {
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "queryType": "traceql",
              "query": "{ status = error }",
              "limit": 20,
              "refId": "A"
            }
          ],
          "options": {}
        },
        {
          "type": "row",
          "title": "Pipeline health \u2014 is the traces layer itself alive",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 30
          }
        },
        {
          "type": "stat",
          "title": "Spanmetrics series present?",
          "description": "1 = the collector's spanmetrics connector is producing series for frontend (the same expression the TracesSpanmetricsMissing alert uses, minus the for:). 0/No Data = the alert is firing or about to; the runbook scenario 'the spanmetrics connector produces no series' starts here.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 31
          },
          "targets": [
            {
              "expr": "absent(traces_span_metrics_calls_total{service_name=\"frontend\", span_kind=\"SPAN_KIND_SERVER\"})",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "MISSING",
                      "color": "red",
                      "index": 0
                    },
                    "0": {
                      "text": "present",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Collector targets up",
          "description": "up{job=\"opentelemetrycollector\"} \u2014 both scrape endpoints (telemetry :8888 self-metrics, metrics :9464 spanmetrics). A 1 here with the panel above red means the collector is alive but the spanmetrics pipeline is not: check the collector's otelcol_processor_* / otelcol_exporter_* metrics two rows over.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 31
          },
          "targets": [
            {
              "expr": "count(up{job=\"opentelemetrycollector\"} == 1)",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "2": {
                      "text": "both up",
                      "color": "green",
                      "index": 0
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 2
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Collector: spans in, spans sampled out, metrics flushed",
          "description": "otelcol_receiver_accepted_spans (all spans arriving), otelcol_processor_dropped_spans (memory_limiter/tail_sampling decisions \u2014 tail_sampling drops are EXPECTED, this is the 10% baseline working), otelcol_exporter_send_failed_spans to otlp/tempo (must stay ~0; a climb means Tempo is refusing writes). From the telemetry scrape on :8888.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 35
          },
          "targets": [
            {
              "expr": "sum(rate(otelcol_receiver_accepted_spans[5m]))",
              "legendFormat": "accepted spans/s",
              "refId": "A"
            },
            {
              "expr": "sum(rate(otelcol_processor_dropped_spans[5m]))",
              "legendFormat": "dropped spans/s",
              "refId": "B"
            },
            {
              "expr": "sum by (exporter) (rate(otelcol_exporter_send_failed_spans[5m]))",
              "legendFormat": "send-failed {{exporter}}",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": [
                "mean",
                "max"
              ]
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Tempo: request latency and bytes received",
          "description": "tempo_request_duration_seconds p99 (the TempoRequestLatency alert's input) and tempo_distributor_bytes_received_total rate \u2014 the write path's own view of whether spans are arriving. A flat bytes rate with collector send-failed at ~0 means nothing is being sent, not that Tempo is refusing.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 35
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (route, le) (rate(tempo_request_duration_seconds_bucket[15m])))",
              "legendFormat": "p99 {{route}}",
              "refId": "A"
            },
            {
              "expr": "sum(rate(tempo_distributor_bytes_received_total[5m]))",
              "legendFormat": "bytes in/s",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "bytes in/s"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "Bps"
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": [
                "mean",
                "max"
              ]
            }
          }
        }
      ],
      "schemaVersion": 39,
      "weekStart": ""
    }
