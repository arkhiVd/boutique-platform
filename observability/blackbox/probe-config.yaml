# The external synthetic probe — probe contract
# -----------------------------------------------------------------------------
# This is the human-readable record of WHAT is probed, not of HOW. The module
# implementations (including the `http_2xx` 5s timeout the brief names) live in
# observability/blackbox/values.yaml under `config.modules`, which is the chart's
# own home for them and the single source of truth — a second copy here would be
# a drift bug waiting for the first incident.
#
# The chart mounts this ConfigMap read-only into the exporter pod at
# /etc/probes, so during an incident
#
#   kubectl -n observability exec deploy/prometheus-blackbox-exporter \
#     -- cat /etc/probes/targets.yaml
#
# answers "what was actually being asked" without reading a Helm release or
# reconstructing it from a ServiceMonitor.
#
# WHY THE TARGET URL IS NOT IN THIS FILE AS A LITERAL
# ---------------------------------------------------
# The target is `https://<frontend-host>/`. The frontend host is created in
# ROADMAP Phase 5 and its DNS name is a Terraform output (`<alb-dns>` or
# `<hash>.ip.sslip.io`, per SPEC unresolved question 2). Writing a literal here
# would be inventing a value this repo has no way to know, and the whole point of
# this repo's rules is that a recorded gap beats a plausible guess.
#
# So the target is a deploy-time value, `platform.externalProbe.url`, and the
# chart's templates/external-probe.yaml renders the Service and ServiceMonitor
# only when it is set. To enable the probe once Phase 5 has produced the DNS
# name:
#
#   helm upgrade --install prometheus-blackbox-exporter observability/blackbox \
#     -n observability \
#     --set platform.externalProbe.url="https://<phase5-alb-dns>/"
#
# Everything else — the module, the 5s timeout, the interval, the metric
# selection — is already in place, so that one flag turns the probe on.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-external-probe-config
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus-blackbox-exporter
    app.kubernetes.io/part-of: boutique-platform
    platform.boutique/probe: external
data:
  targets.yaml: |
    # One entry per probe. `module` must exist under config.modules in
    # observability/blackbox/values.yaml.
    probes:
      - name: frontend-external
        # The public hostname, from OUTSIDE the cluster: the probe exits the
        # node, crosses the ALB and the Web ACL, and comes back. This is the only
        # signal in the platform that covers that layer, because an application
        # metric is generated by the very thing that is unreachable.
        target: https://<frontend-host>/
        module: http_2xx_external
        interval: 60s
        # What "success" means, spelled out so the alert is auditable:
        #   - HTTP/1.1 or HTTP/2.0 with a 200 status (SPEC's edge criterion)
        #   - a valid TLS chain at TLS 1.2 or better (SPEC trust boundary 1)
        #   - no redirect: a 301 here means the two-layer edge is wrong, because
        #     the http:// listener is the thing that is supposed to redirect
        #   - completes inside 5s
        expect:
          - valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          - valid_status_codes: [200]
          - follow_redirects: false
          - fail_if_not_ssl: true
          - timeout: 5s
        # The PromQL the probe feeds, so the contract is checkable:
        #   synthetic:availability_ratio_rate5m
        # recorded in observability/rules/boutique-slo-recording.yaml from
        # probe_success{job="frontend-external"}.

      - name: frontend-internal
        # The control probe: the frontend Service directly, bypassing the ALB and
        # Traefik. external fails + internal succeeds = the edge, not the app.
        target: http://frontend.boutique.svc.cluster.local/
        module: http_2xx_internal
        interval: 60s
        expect:
          - valid_status_codes: [200, 405]

      - name: frontend-tls
        # Certificate expiry. probe_ssl_earliest_cert_expiry is in seconds, so
        # the alert is a plain threshold. SPEC's Phase 13 cert-expiry runbook
        # reads this series.
        target: https://<frontend-host>/
        module: ssl_cert_expiry
        interval: 1h
        expect:
          - fail_if_not_ssl: true

      - name: redis-cart-tcp
        # redis-cart has no HTTP surface at all, so a bare TCP check is the only
        # synthetic that can say anything about it.
        target: redis-cart.boutique.svc.cluster.local:6379
        module: tcp_connect
        interval: 60s

  runbook.md: |
    ## Reading the probe during an incident

    | symptom | what it means |
    |---|---|
    | `probe_success{job="frontend-external"} == 0` and `probe_success{job="frontend-internal"} == 1` | the application is healthy, the edge is not. Check the ALB target group, the Web ACL rate limit, and DNS. |
    | both 0 | the workload node has lost external egress. On a public-subnet node with no NAT that is an IGW route-table or security-group problem, not a Boutique problem. |
    | `probe_http_status_code` non-zero but `probe_success == 0` | the endpoint answers but the status is wrong — the redirect check or the valid_status_codes list is being violated. |
    | `probe_ssl_earliest_cert_expiry` negative | the certificate has expired. SPEC's Phase 13 cert-expiry runbook. |
    | no series at all for `job="frontend-external"` | the probe was never enabled: `platform.externalProbe.url` is empty, or the ServiceMonitor lost the `release` label. |

    Metrics the probe emits, after the metricRelabelings in
    templates/external-probe.yaml: `probe_success`,
    `probe_duration_seconds`, `probe_http_duration_seconds`,
    `probe_http_status_code`, `probe_ssl_earliest_cert_expiry`.
