# Traefik chart values. Every override states why, because a value that is not
# explained gets reverted by someone who does not know what it broke.

# The hostname every IngressRoute in templates/routes.yaml matches on. It has to
# be one of the SANs on the imported edge certificate
# (scripts/tls/generate-selfsigned.sh: boutique.local, localhost, *.ip.sslip.io)
# or the router matches and the browser then rejects the certificate.
#
# `boutique.local`, an exact SAN rather than the wildcard, because the ALB's DNS
# name changes whenever the load balancer is recreated and is not a SAN at all.
# Reaching it is one line: `<alb-dns> boutique.local` in /etc/hosts.
#
# Left unset until 2026-10-14, which rendered `Host(``)` on every route and
# meant the chart installed green while nothing routed.
frontendHost: boutique.local

# Same contract as frontendHost: templates/routes.yaml matches IngressRoutes on
# these, and an unset value renders `Host(<empty>)`, which nothing ever matches.
# Both are subdomains of boutique.local so the storefront, Grafana and Jenkins
# are three distinct hosts on one listener.
#
# Known gap, recorded rather than discovered later: the imported edge
# certificate (scripts/tls/generate-selfsigned.sh) lists boutique.local,
# localhost and *.ip.sslip.io, so these two subdomains do not validate at the
# ALB today -- the ALB serves its default certificate and the browser warns.
# Fix before the Grafana and Jenkins stages by adding `*.boutique.local` to
# HOSTS, regenerating, and re-importing to ACM; imported certificates are free.
grafanaHost: grafana.boutique.local
# kube-prometheus-stack names its Grafana Service <release>-grafana.
grafanaService: kube-prometheus-stack-grafana
jenkinsHost: jenkins.boutique.local

traefik:
  # The dashboard is off, and that is what makes exposing the `traefik`
  # entrypoint above acceptable. The upstream chart says in as many words that
  # this port should not be exposed on a production deployment, because it
  # hosts /dashboard/ and /api. With `api.dashboard=false` those are gone and
  # the exposed entrypoint answers one thing: /ping, which is exactly what the
  # ALB target groups ask for. Nothing in this repo reads the Traefik
  # dashboard -- the dashboards story is Grafana's, in observability/.
  api:
    dashboard: false

  # --- which namespaces Traefik is allowed to route out of -----------------
  # allowCrossNamespace is the switch this chart ships off, and with it off
  # every route in templates/routes.yaml was refused with the same line in the
  # pod log, over and over:
  #
  #   ERR error="service boutique/frontend not in the parent resource namespace
  #        traefik" ingress=frontend namespace=traefik providerName=kubernetescrd
  #
  # The routes live in traefik/ so the edge's whole surface is one file in one
  # place, but their services live in boutique/, observability/ and ci/. A
  # KubernetesIngressRoute may only name a Service in its own namespace unless
  # the provider is told otherwise, and Traefik enforces that by dropping the
  # route rather than by returning an error to the client -- which is why the
  # ALB answered 404 with every target healthy and every pod Running.
  #
  # It is paired with an explicit namespace list rather than left watching the
  # whole cluster. allowCrossNamespace alone would mean any IngressRoute in any
  # namespace could point at any Service anywhere; bounding the watch list keeps
  # the set of objects that can publish something at three namespaces. The
  # kubernetesIngress provider is bounded to the same three, so the Ingress API
  # is not the wider door into the same house.
  providers:
    kubernetesCRD:
      allowCrossNamespace: true
      namespaces:
        - traefik
        - boutique
        - observability
        - ci
    kubernetesIngress:
      namespaces:
        - traefik
        - boutique
        - observability
        - ci

  # --- deployment shape ---------------------------------------------------
  # A DaemonSet, not a Deployment: the chart expresses it as deployment.kind,
  # not a separate daemonset block (verified against the 39.0.1 values schema).
  # The ALB's target group registers every node on the NodePort, and a node with
  # no Traefik pod is a node whose only ALB target is unhealthy. A DaemonSet is
  # what guarantees the invariant that a Ready node always runs Traefik.
  deployment:
    kind: DaemonSet

  # --- entry points -------------------------------------------------------
  ports:
    web:
      port: 8000
      expose:
        default: true
      exposedPort: 80
      nodePort: 32080
      protocol: TCP
      # Traefik itself upgrades plaintext to HTTPS at the entry point. This is
      # the second layer of the two-layer edge: the ALB's port-80 listener also
      # redirects, and this catches anything that still arrives on port 80 — a
      # direct node-IP hit on :32080, for example, which never touches the ALB.
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
    websecure:
      port: 8443
      expose:
        default: true
      exposedPort: 443
      nodePort: 32443
      protocol: TCP
      # TLS is enabled on this entry point (the chart's default). In self-signed
      # cert mode the ALB holds the ACM cert and re-encrypts to Traefik's own
      # self-signed one, so the hop is end-to-end encrypted. In http01 mode a
      # cert-manager issued cert terminates here instead.
    # The metrics entrypoint, and the one value that makes it useful.
    #
    # MEASURED 2026-10-16. The chart ships this entry with
    # `expose.default: false` ("You may not want to expose the metrics port on
    # production deployments"), and that default is why the Service rendered
    # only web/websecure/traefik while the Deployment already exposed
    # containerPort 9100 named `metrics`. The hand-written ServiceMonitor in
    # observability/servicemonitors/traefik.yaml named `port: metrics`, so it
    # pointed at a port that existed on the pod and on no Service: every
    # Traefik series was dark, and `TargetDown` paged forever from its
    # `absent(up{job="traefik"})` branch -- an alert that fires because there
    # is no data, caused by there being no data.
    #
    # `true` puts 9100 on the cluster-internal Service so Prometheus can
    # scrape it, which is the one consumer the chart's default was protecting
    # it from. There is no nodePort here, so the port is still unreachable
    # from outside the cluster, and `metrics.prometheus.service.enabled` is
    # not a key in traefik chart v39 (rendering with it set produces no second
    # Service), so a port on the Service that exists is the only option.
    metrics:
      port: 9100
      protocol: TCP
      expose:
        default: true

    # Traefik's own entrypoint, which is where --ping answers (the liveness
    # probe hits :8080/ping inside the pod, so this is already the health
    # endpoint of record). It is exposed for one reason: the ALB target groups
    # health-check it.
    #
    # Measured 2026-10-14: health_check was `GET http://<node>:32080/ping`
    # expecting 200, but :32080 is the `web` entrypoint, which answers every
    # request with the entrypoint's 301 to https -- and the IngressRoute's own
    # `/ping` rule sends anything that survives that to the frontend Service,
    # not to Traefik. No configuration of :32080 returns 200, so every target
    # was permanently unhealthy. Publishing this entrypoint gives the check the
    # endpoint the runbook always meant it to probe.
    traefik:
      expose:
        default: true
      exposedPort: 8080
      nodePort: 32081
      protocol: TCP

  # --- metrics ------------------------------------------------------------
  # This is the fix for the recorded latency-SLI gap. Traefik's default buckets
  # are 0.1, 0.3, 1.2, 5.0 and 15 seconds, so a p95 computed from them can only
  # resolve to one of those five numbers. The Boutique app's own latency is
  # concentrated in the sub-second range and the checkout path is the one we
  # alert on, so the buckets below put six resolution points under one second.
  metrics:
    prometheus:
      enabled: true
      # The observability namespace labels this and scrapes it; see
      # observability/servicemonitors/traefik.yaml.
      # The ServiceMonitor is written by hand in observability/servicemonitors/
      # (the same pattern used for every other source on this platform, and
      # already reviewed). Rendering one from this chart would need the
      # Prometheus Operator CRDs present just to template the chart, and would
      # split the monitoring config across two places.
      serviceMonitor:
        enabled: false
      # This is the fix for the recorded latency-SLI gap. Traefik's default
      # buckets are 0.1, 0.3, 1.2, 5.0 and 15 seconds, so a p95 computed from them
      # can only resolve to one of those five numbers. The Boutique app's own
      # latency is concentrated in the sub-second range and the checkout path is
      # the one the latency SLO alerts on, so the buckets below put six
      # resolution points under one second.
      #
      # A comma-separated string, because the chart schema wants a string: it is
      # passed to --metrics.prometheus.buckets as one flag argument.
      buckets: "0.05,0.1,0.25,0.5,1,2.5,5,10"
      addRouters: true
      addServicesLabels: true

  # --- persistence and logging --------------------------------------------
  logs:
    general:
      level: INFO
    access:
      enabled: true
      # Access logs to stdout so Fluent Bit collects them into Loki with no
      # sidecar. The WAF log is CloudWatch, the ALB log is S3, and this one is
      # Loki: three logs at three layers, each owned by the layer that sees the
      # request.
      format: json
      fields:
        general:
          defaultmode: keep
          names:
            ClientHost: keep
            RequestPath: keep
            RequestMethod: keep
            DownstreamStatus: keep
            OriginStatus: keep
            Duration: keep
            RequestHost: keep
            ServiceName: keep
        headers:
          defaultmode: drop
          names:
            X-Forwarded-For: keep
            User-Agent: keep

  # --- resources ----------------------------------------------------------
  # Sized against the measured platform budget. The full stack is 3850m of CPU
  # requests (3600m before Phase 11) over a four-node cluster with a 1600m
  # sustained t3 baseline, and Traefik is on the path of every single request,
  # so it is given a guaranteed-feeling request and a ceiling it will not reach
  # in normal use.
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

  # --- security -----------------------------------------------------------
  # DaemonSet pods run with a host-network-lite posture (they read the node's
  # network namespace only if hostNetwork is set; it is not) and drop caps.
  securityContext:
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
    runAsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532
  podSecurityContext:
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  # --- scheduling ---------------------------------------------------------
  # Run on every schedulable node, so the ALB target group is always whole.
  tolerations: []
  affinity:
    nodeAffinity: null

  # The TLS cert resolver is only used in the http01 cert mode. It is declared
  # here so the resolver exists when cert-manager issues a real certificate;
  # in self-signed mode, the ALB holds the ACM cert and Traefik's default
  # self-signed cert covers the inner hop.
  # No ACME arguments here. The chart refuses to render a DaemonSet with any
  # `--certificatesresolvers.*.acme.*` argument, because ACME writes acme.json and
  # a DaemonSet runs one pod per node — each with its own copy — so renewal would
  # race and clobber. The HTTP-01 challenge therefore runs in cert-manager
  # (cluster/traefik/templates/certmanager.yaml), which is a single Deployment and
  # stores its account key in a Secret, and Traefik picks the issued certificate
  # up from that Secret. The IngressRoutes reference certResolver only by name,
  # and in self-signed mode that resolver is never used.
  additionalArguments: []

  # Off, and it has to be: this is a DaemonSet and a PVC is a single RWO
  # volume. Measured 2026-10-14 on the first install -- three of four pods
  # stayed Pending with
  #   0/4 nodes: 1 node(s) didn't find available persistent volumes to bind,
  #             3 node(s) didn't satisfy plugin(s) [NodeAffinity]
  # because local-path binds one PV whose nodeAffinity pins it to a single node.
  # The chart's fallback is an emptyDir on /data, which is what this deployment
  # wants anyway: there is no ACME here (see additionalArguments above), so the
  # only thing that would live in acme.json is a resolver this mode never uses.
  persistence:
    enabled: false
    storageClass: local-path
    size: 1Gi

  # NodePort, not the chart's LoadBalancer default. k3s's ServiceLB is disabled
  # in platform/nodes.tf for the reason stated above, so a LoadBalancer Service
  # would sit at `<pending>` forever -- a permanently unready object that reads
  # like a failure to anyone running `kubectl get svc`. The ALB never uses this
  # Service anyway: its target groups attach directly to the instance NodePorts
  # (platform/edge.tf), and the ports below are the ones those attachments use.
  service:
    type: NodePort

# --- the CRDs the ingress routes use ---------------------------------------
# Traefik's CRDs are installed by the chart as dependencies; these extraObjects
# pin them so a chart upgrade cannot silently replace a CRD version we tested.
crds:
  enabled: true
