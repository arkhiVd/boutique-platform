# {{- if .Values.tlsSecretName }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-edge
  namespace: traefik
spec:
  secretName: {{ .Values.tlsSecretName | quote }}
  # ACME HTTP-01 against the ALB hostname, which is why the ACM certificate in
  # platform/edge.tf is skipped in http01 mode.
  dnsNames:
    - {{ .Values.frontendHost | quote }}
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: aravindakrishnan@example.invalid
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
