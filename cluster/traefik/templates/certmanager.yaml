{{- if .Values.tlsSecretName }}
# Both objects are inside the guard, not just the Certificate. The ClusterIssuer
# used to sit AFTER the guard's end, so it rendered unconditionally and the
# install failed with "no matches for kind ClusterIssuer" -- cert-manager is not
# installed in the self-signed mode this platform deploys, and neither object
# belongs on a cluster that is not running it. Go templates have no comment
# syntax, so this file must not contain the words this note used to spell out;
# inside a template they are parsed as directives, not as prose.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-edge
  namespace: traefik
spec:
  secretName: {{ .Values.tlsSecretName | quote }}
  # ACME HTTP-01 against the ALB hostname, which is why the ACM certificate in
  # platform/edge.tf is skipped in http01 mode.
  dnsNames:
    - {{ .Values.frontendHost | quote }}
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: aravindakrishnan@example.invalid
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
{{- end }}
