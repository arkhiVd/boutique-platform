# PR plan gate.
#
# Plan only. It cannot mutate infrastructure: it assumes a read-only OIDC role and never runs
# `terraform apply`. Every third-party action is pinned to a commit SHA with the version in a
# comment, verified against the GitHub API on 2026-10-08. Do not substitute a guessed SHA.

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0

  terraform:
    name: terraform plan
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cost estimate
        run: ./scripts/cost-estimate.sh

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -recursive -check -diff

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - name: tflint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.60.0
          cache: "true"
      - run: tflint --recursive --format compact

      - name: shellcheck
        run: |
          shellcheck -x scripts/*.sh
          bash -n scripts/*.sh

      - name: actionlint
        run: bash scripts/actionlint.sh

      - name: validate kubernetes manifests
        run: |
          curl -sSL --max-time 120 -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary -kubernetes-version v1.36.3 \
            apps/ ci/ observability/

      # Dependabot PRs cannot see secrets, so the real plan is skipped for them —
      # a green no-secrets run is still a useful signal, and the plan runs on every
      # human PR.
      - name: configure AWS credentials
        if: github.actor != 'dependabot[bot]'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          role-session-name: boutique-plan-${{ github.run_id }}
          aws-region: us-east-1

      - name: terraform init (backend)
        if: github.actor != 'dependabot[bot]'
        run: terraform init

      - name: terraform plan
        if: github.actor != 'dependabot[bot]'
        run: terraform plan -input=false -no-color -out=tfplan

      - name: checkov (IaC scan)
        if: github.actor != 'dependabot[bot]'
        uses: bridgecrewio/checkov-action@c13aafd679d3814a25067d10fcaf98c4f7594931 # v12.3131.0
        continue-on-error: true
        with:
          directory: .
          framework: terraform
          quiet: true

      - name: post plan and cost on the PR
        if: github.actor != 'dependabot[bot]' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          terraform show -no-color tfplan > plan.txt
          {
            echo "### Cost estimate"
            echo '```'
            ./scripts/cost-estimate.sh
            echo '```'
            echo "### Plan — creates / changes / destroys / replaces"
            echo '```'
            grep -E '^Plan:|^  # ' plan.txt | head -200
            echo '```'
            echo "### Residual risk"
            echo "Counted above are the exact creates, changes, destroys and replaces. A"
            echo "destroy or replace here must be expected and justified in the PR body."
          } > body.md
          gh pr comment "${{ github.event.number }}" --body-file body.md
