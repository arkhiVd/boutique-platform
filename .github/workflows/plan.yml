# PR plan gate.
#
# Plan only. It cannot mutate infrastructure: it assumes a read-only OIDC role and never runs
# `terraform apply`. Every third-party action is pinned to a commit SHA with the version in a
# comment, verified against the GitHub API on 2026-10-08. Do not substitute a guessed SHA.

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@1371ffca5405c3aff0215e23384577a3d7d60e73 # v2.0.4

  terraform:
    name: terraform plan
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: cost estimate
        run: ./scripts/cost-estimate.sh

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -recursive -check -diff

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - name: tflint
        uses: terraform-linters/setup-tflint@19a52fbac37dacb22a09518e4ef6ee234f2d4987 # v4.0.0
        with:
          tflint_version: v0.60.0
          cache: "true"
      - run: tflint --recursive --format compact

      - name: shellcheck
        run: |
          shellcheck -x scripts/*.sh
          bash -n scripts/*.sh

      - name: actionlint
        run: bash scripts/actionlint.sh

      - name: validate kubernetes manifests
        run: |
          curl -sSL --max-time 120 -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary -kubernetes-version v1.36.3 \
            apps/ ci/ observability/

      # Dependabot PRs cannot see secrets, so the real plan is skipped for them —
      # a green no-secrets run is still a useful signal, and the plan runs on every
      # human PR.
      - name: configure AWS credentials
        if: github.actor != 'dependabot[bot]'
        uses: aws-actions/configure-aws-credentials@4fc4975a852c8cd99761e2de1f4ba73402e44dd9 # v4.0.3
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          role-session-name: boutique-plan-${{ github.run_id }}
          aws-region: us-east-1

      # Phase 3's k3s join token is an EPHEMERAL variable, and an ephemeral
      # variable cannot have a default: without one, `terraform plan` stops with
      # "No value for required variable". That is the property that keeps the
      # token out of the state and out of git (platform/nodes.tf's header has the
      # two verified facts), and its cost is that every Terraform command has to
      # be handed a value.
      #
      # The value below never reaches AWS: this workflow runs plan only, never
      # apply, and the plan output prints `+ value = (sensitive value)` with the
      # literal value appearing in neither the plan text, the plan JSON, nor a
      # saved plan file. It is a fixed non-secret string rather than a repo secret
      # on purpose -- a secret that CI never sends to AWS is a secret with no
      # reason to exist, and a fixed string cannot drift.
      #
      # If the repo secret K3S_TOKEN_PLAN_ONLY is ever set to the real token,
      # nothing changes for CI: it still only ever plans.
      - name: provide the ephemeral k3s token variable for the plan
        run: echo "TF_VAR_k3s_token=${K3S_TOKEN_PLAN_ONLY:-ci-plan-only-not-a-credential}" >> "$GITHUB_ENV"

      - name: terraform init (backend)
        if: github.actor != 'dependabot[bot]'
        run: terraform init

      - name: terraform plan
        if: github.actor != 'dependabot[bot]'
        run: terraform plan -input=false -no-color -out=tfplan

      - name: checkov (IaC scan)
        if: github.actor != 'dependabot[bot]'
        uses: bridgecrewio/checkov-action@c13aafd679d3814a25067d10fcaf98c4f7594931 # v12.3131.0
        continue-on-error: true
        with:
          directory: .
          framework: terraform
          quiet: true

      - name: post plan and cost on the PR
        if: github.actor != 'dependabot[bot]' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          terraform show -no-color tfplan > plan.txt
          {
            echo "### Cost estimate"
            echo '```'
            ./scripts/cost-estimate.sh
            echo '```'
            echo "### Plan — creates / changes / destroys / replaces"
            echo '```'
            grep -E '^Plan:|^  # ' plan.txt | head -200
            echo '```'
            echo "### Residual risk"
            echo "Counted above are the exact creates, changes, destroys and replaces. A"
            echo "destroy or replace here must be expected and justified in the PR body."
          } > body.md
          gh pr comment "${{ github.event.number }}" --body-file body.md
