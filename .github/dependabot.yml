version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]

  # The two Terraform roots. The repository top level has no .tf files, so
  # "/" watched nothing (the same root-directory mistake the plan job had).
  - package-ecosystem: terraform
    directories: ["/bootstrap", "/platform"]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    labels: ["dependencies", "terraform"]

# No docker entry: the repository builds no image (no Dockerfile anywhere), and
# the entry that pointed at "/" failed on every run. Workload images are pinned
# by tag and digest in the manifests and charts, and are bumped there.
