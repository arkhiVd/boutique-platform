---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paymentservice
  namespace: boutique
  labels:
    app: paymentservice
    app.kubernetes.io/name: paymentservice
    app.kubernetes.io/part-of: online-boutique
    app.kubernetes.io/version: v0.10.7
# ADDED (upstream omits). See base/frontend.yaml.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice
  namespace: boutique
  labels:
    app: paymentservice
    app.kubernetes.io/name: paymentservice
    app.kubernetes.io/part-of: online-boutique
    app.kubernetes.io/version: v0.10.7
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: paymentservice
  template:
    metadata:
      labels:
        app: paymentservice
        app.kubernetes.io/name: paymentservice
        app.kubernetes.io/part-of: online-boutique
        app.kubernetes.io/version: v0.10.7
    spec:
      serviceAccountName: paymentservice
      priorityClassName: boutique-app
      terminationGracePeriodSeconds: 5
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # ADDED (upstream omits).
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: paymentservice
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: paymentservice
              topologyKey: kubernetes.io/hostname
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/paymentservice:v0.10.7
        ports:
        - containerPort: 50051
        startupProbe:
          grpc:
            port: 50051
          periodSeconds: 5
          failureThreshold: 12
        readinessProbe:
          grpc:
            port: 50051
        livenessProbe:
          grpc:
            port: 50051
        env:
        - name: PORT
          value: "50051"
        - name: DISABLE_PROFILER
          value: "1"
        # ADDED. OTel wiring; see base/frontend.yaml.
        - name: ENABLE_TRACING
          value: "1"
        - name: OTEL_SERVICE_NAME
          value: "paymentservice"
        - name: COLLECTOR_SERVICE_ADDR
          value: "opentelemetrycollector.observability.svc.cluster.local:4317"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://opentelemetrycollector.observability.svc.cluster.local:4317"
        - name: OTEL_TRACES_SAMPLER
          value: "parentbased_traceidratio"
        - name: OTEL_TRACES_SAMPLER_ARG
          value: "1"
        resources:
          requests:
            # CHANGED (upstream limits 200m→100m): see base/frontend.yaml.
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: paymentservice
  namespace: boutique
  labels:
    app: paymentservice
spec:
  type: ClusterIP
  selector:
    app: paymentservice
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: paymentservice
  namespace: boutique
  labels:
    app: paymentservice
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: paymentservice
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: paymentservice
  namespace: boutique
  labels:
    app: paymentservice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: paymentservice
  minReplicas: 2
  # ADDED. Shape of call: once per checkout, and it is the only service on the
  # path that must never be the thing that fails an order, so two replicas
  # minimum with a modest ceiling.
  # Bounded by the boutique ResourceQuota, not by taste: the HPA budget table in
  # apps/boutique/quota.yaml sums every maxReplicas against the quota, and
  # policy rule deny_hpa_ceiling_exceeds_quota fails the gate if they stop fitting.
  # Pinned at min: the quota's scale-out headroom goes to the request path first.
  maxReplicas: 2
  metrics:
  # ADDED, and not decoration: autoscaling/v2 removed
  # spec.targetCPUUtilizationPercentage. The API server still accepts it as a
  # legacy alias, but it is not in the v2 schema and kubeconform -strict rejects
  # it. The explicit form is also the honest one — it names the metric and the
  # target rather than relying on a default that the schema does not carry.
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
