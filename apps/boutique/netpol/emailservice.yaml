apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: emailservice
  namespace: boutique
spec:
  podSelector:
    matchLabels:
      app: emailservice
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Mirrors upstream's network-policy-emailservice.yaml exactly: checkoutservice
  # only. The port is 8080 — the destination pod's port — because the
  # emailservice Service publishes 5000 and targets 8080. Upstream's file says
  # 8080 too, so this is one of the places upstream is already right and the
  # transcription has to be careful rather than clever.
  - from:
    - podSelector:
        matchLabels:
          app: checkoutservice
    ports:
    - port: 8080
      protocol: TCP
  egress:
  # DNS carve-out upstream omits, plus trace export. Nothing else: upstream's
  # emailservice runs `start(dummy_mode = True)` and never opens an SMTP
  # connection. If it ever did, this is the rule that would have to gain an SMTP
  # destination — and that is the point of writing it down.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app: opentelemetrycollector
    ports:
    - port: 4317
      protocol: TCP
