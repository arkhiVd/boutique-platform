apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shippingservice
  namespace: boutique
spec:
  podSelector:
    matchLabels:
      app: shippingservice
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Mirrors upstream's network-policy-shippingservice.yaml exactly: frontend and
  # checkoutservice, on pod port 50051.
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    - podSelector:
        matchLabels:
          app: checkoutservice
    ports:
    - port: 50051
      protocol: TCP
  egress:
  # DNS carve-out upstream omits, plus trace export — with the same honest
  # caveat as adservice: upstream's shippingservice/main.go has an
  # `initTracing()` whose entire body is a TODO, and DISABLE_TRACING=1 is set in
  # base/shippingservice.yaml. Nothing connects today; the rule exists so the
  # path is already open when the gap closes.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app: opentelemetrycollector
    ports:
    - port: 4317
      protocol: TCP
