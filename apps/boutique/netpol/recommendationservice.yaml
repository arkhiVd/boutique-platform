apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recommendationservice
  namespace: boutique
spec:
  podSelector:
    matchLabels:
      app: recommendationservice
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Mirrors upstream's network-policy-recommendationservice.yaml exactly:
  # frontend only, on pod port 8080.
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - port: 8080
      protocol: TCP
  egress:
  # DNS carve-out upstream omits, plus the single downstream dependency from
  # PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550, plus trace export.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app: opentelemetrycollector
    ports:
    - port: 4317
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app: productcatalogservice
    ports:
    - port: 3550
      protocol: TCP
