apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: checkoutservice
  namespace: boutique
spec:
  podSelector:
    matchLabels:
      app: checkoutservice
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Mirrors upstream's network-policy-checkoutservice.yaml exactly: frontend only,
  # on the pod's port 5050.
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - port: 5050
      protocol: TCP
  egress:
  # DNS carve-out upstream omits (see netpol/frontend.yaml).
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app: opentelemetrycollector
    ports:
    - port: 4317
      protocol: TCP
  # Read from checkoutservice's own env block. Note 5000, not 8080: the
  # emailservice Service publishes 5000 and targets the pod's 8080, so the
  # *pod* port the policy must allow is 8080. This is the one pair in the app
  # where the Service port and the pod port differ, and it is where a
  # memory-based transcription of the policy would silently break checkout.
  - to:
    - podSelector:
        matchLabels:
          app: productcatalogservice
    ports:
    - port: 3550
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app: shippingservice
    ports:
    - port: 50051
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app: paymentservice
    ports:
    - port: 50051
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app: emailservice
    ports:
    - port: 8080
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app: currencyservice
    ports:
    - port: 7000
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app: cartservice
    ports:
    - port: 7070
      protocol: TCP
