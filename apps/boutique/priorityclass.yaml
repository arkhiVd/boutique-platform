apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: boutique-app
value: 1000
globalDefault: false
description: >-
  Boutique request path. Above the cluster default (0) and above
  boutique-observability, so a node under CPU or memory pressure sheds
  telemetry before it sheds the thing a user is waiting for.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
value: 500
globalDefault: false
description: >-
  The OTel Collector gateway. Above boutique-batch so trace export survives a
  load-generator incident, below boutique-app so it never outranks the request
  path it is measuring.
metadata:
  name: boutique-observability
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
value: 100
globalDefault: false
description: >-
  loadgenerator. Lowest of the three: it is the source of demand, not capacity.
  The kubelet should evict the traffic before the traffic's dependencies.
metadata:
  name: boutique-batch
# ADDED (all three). Upstream ships no PriorityClass anywhere in the tree, which
# means every Boutique pod schedules at the cluster default of 0 and competes
# equally with the CNI agent, kube-proxy and the metrics stack. The values are
# deliberately far below `system-cluster-critical` (2000001000) and
# `system-node-critical`, so nothing here can outrank the node's own components.
