apiVersion: v1
kind: ResourceQuota
metadata:
  name: boutique-quota
  namespace: boutique
spec:
  hard:
    # Sized from the cluster, not from the namespace: see the HPA budget at the
    # bottom of this file. policy/resources.rego rule 5 enforces it in CI.
    requests.cpu: "3600m"
    requests.memory: "3Gi"
    limits.cpu: "4"
    # 5212Mi at every HPA's maxReplicas; 5.5Gi keeps 420Mi for a canary pod.
    limits.memory: "5632Mi"
    # 40 pods against 22 at minimum replicas (10 services x 2 + redis-cart 1 +
    # loadgenerator 1): room for a canary set, a `kubectl debug` pod, a runbook
    # one-off, and an HPA scale-up, without reopening the ceiling by hand.
    pods: "40"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: boutique-limits
  namespace: boutique
spec:
  limits:
  # Container-level. Every container in apps/boutique/base/ already carries both
  # requests and limits, so today this LimitRange is a safety net for the *next*
  # manifest rather than a live constraint on this one — which is exactly the
  # point: an unbounded container added to this namespace at 3am should fail
  # admission, not silently take a node down.
  - type: Container
    default:
      cpu: 200m
      memory: 128Mi
    defaultRequest:
      cpu: 100m
      memory: 64Mi
    # max must stay above the largest value the namespace actually deploys,
    # otherwise the quota starts rejecting pods that already exist. Largest
    # deployed today: loadgenerator at 300m CPU / 512Mi memory. 2 CPU / 1 GiB
    # leaves real headroom while still capping any single container at the whole
    # CPU budget of one t3.medium, so no single container can starve the node on
    # its own request alone.
    max:
      cpu: "2"
      memory: 1Gi
    min:
      cpu: 10m
      memory: 16Mi
  # Pod-level: the sum of the pod's containers, not each container individually.
  # Largest pod today is loadgenerator (main + initContainer) at 350m / 544Mi.
  - type: Pod
    max:
      cpu: "3"
      memory: 2Gi

# ===========================================================================
# HPA BUDGET, against the live cluster (re-measured 2026-10-17)
#
# The previous block sized this quota for one t3.medium. The cluster that
# shipped is 1 x c7i-flex.large + 3 x t3.small, all four schedulable, and the
# quota was never re-derived for it: the HPAs summed to 6470m of CPU requests
# at maxReplicas against a 3000m cap, with 230m of headroom at the floor. Most
# HPAs could not scale at all, and nothing said so.
#
# The ceiling comes from losing a node, not from the healthy cluster:
#
#   allocatable, 4 nodes                          8000m     ~9543Mi
#   minus one t3.small (the N-1 case)            -2000m     -1909Mi
#   minus every non-boutique request (live)      -2020m     -3780Mi
#   ----------------------------------------------------------------
#   what boutique can hold with a node down       3980m     ~3854Mi
#   requests.cpu, keeping ~10% for bin-packing    3600m
#
# At the floor (min replicas) boutique requests 2770m, so scale-out headroom is
# 830m. It goes to the request path, where load arrives first:
#
#   frontend 2->5, cartservice 2->3, checkoutservice 2->3, currencyservice 2->3,
#   productcatalogservice 2->3                    = +800m, +512Mi requests
#
# adservice, emailservice, paymentservice, recommendationservice and
# shippingservice keep an HPA (policy/resources.rego requires one) pinned at
# min == max == 2. Widening any of them means narrowing another or raising this
# quota, and the gate makes that trade visible instead of silent.
#
# At every HPA's maxReplicas (scripts/check-hpa-quota.py, 2026-10-17):
#
#   requests.cpu     3570m  of 3600m   (99%)
#   requests.memory  2728Mi of 3072Mi  (89%)
#   limits.cpu       3570m  of 4000m   (89%)
#   limits.memory    5212Mi of 5632Mi  (93%)
#   pods             29     of 40
#
# Enforced:   policy/resources.rego rule 5 (conftest --combine, laptop and CI)
# Table:      kubectl kustomize apps/boutique | scripts/check-hpa-quota.py
# ===========================================================================
