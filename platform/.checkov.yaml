# Checkov configuration for the platform/ stack.
#
# Checks are suppressed only where the finding is a false positive for this
# stack or a deliberate, priced deviation, and every line names its reason.
# Nothing here is a bare skip. Checkov loads exactly one config per run: this
# file when it scans this directory (`checkov -d platform`), and scripts/check.sh
# runs it that way so this list never leaks into the bootstrap/ scan.
#
# Rule of the file: a real defect found by checkov gets fixed in the .tf, not
# added here. CKV2_AWS_12 (the VPC default security group leaving all-traffic
# rules in place) was that case, and it is now fixed with an
# aws_default_security_group resource instead of a skip.

skip-check:
  # The SSM agent's own actions (ssm:UpdateInstanceInformation, ssmmessages:*,
  # ec2messages:Get*), ecr:GetAuthorizationToken and cloudwatch:PutMetricData all
  # have to be granted on "*" because AWS does not support resource-level
  # permissions for them. Evidence, from this account, 2026-10-09:
  # `aws iam get-policy-version --policy-arn arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore --version-id v2`
  # returns three statements and all three carry "Resource": "*". Narrowing the
  # ARN here would not tighten the role, it would deny the agent at runtime.
  # Read https://docs.aws.amazon.com/service-authorization/latest/reference/list_awssecuritytokenmessagingservice.html
  # and the SSM/CloudWatch equivalents: none of these actions take a resource ARN.
  - CKV_AWS_111
  - CKV_AWS_356

  # Port 80 on the edge group is the public entry point by design. SPEC trust
  # boundary 1 puts the ALB and its Web ACL in front of it, and the HTTP listener
  # only ever redirects to https; the port has to be reachable for that to work.
  # https://docs.prismacloud.io/en/enterprise-edition/policy-reference/aws-policies/aws-networking-policies/ensure-aws-security-groups-do-not-allow-ingress-from-00000-to-port-80
  - CKV_AWS_260

  # map_public_ip_on_launch = true is the cost decision, stated in vpc.tf: the
  # account has no NAT gateway budget, so nodes with a public IP and narrow
  # security groups are cheaper and tighter than private nodes behind a NAT.
  # https://docs.prismacloud.io/en/enterprise-edition/policy-reference/aws-policies/aws-networking-policies/ensure-vpc-subnets-do-not-assign-public-ip-by-default
  - CKV_AWS_130

  # The parameter holds the public k3s release channel ("stable"), not a secret:
  # SecureString would hide a string that is printed in every k3s release note.
  # The node role reads this one parameter only.
  - CKV2_AWS_34

  # The groups are created in the network phase and attached to instances in
  # ROADMAP Phase 3, which is a deliberate split: the network and the node
  # identity are reviewed separately, so there is no instance to attach to yet.
  # https://docs.prismacloud.io/en/enterprise-edition/policy-reference/aws-policies/aws-networking-policies/ensure-that-security-groups-are-attached-to-ec2-instances-or-elastic-network-interfaces-enis
  - CKV2_AWS_5

  # VPC flow logs are not enabled, and this is a real omission rather than a
  # false positive. They cost $0.50 per GB ingested in CloudWatch Logs against a
  # $30/month budget that the SPEC has already allocated, and the security story
  # here is proven by the security group rules themselves -- the Phase 3
  # acceptance criterion is `aws ec2 describe-security-groups` showing no 22/tcp,
  # which this stack makes literally true. Packet-flow evidence is the next
  # thing to add when a phase needs it; recorded here rather than passed over.
  # https://docs.prismacloud.io/en/enterprise-edition/policy-reference/aws-policies/aws-logging-policies/logging-9-enable-vpc-flow-logging
  - CKV2_AWS_11

  # Cross-region replication on the etcd snapshot bucket. This is a deliberate
  # deviation and the same one bootstrap/.checkov.yaml makes for the state bucket:
  # replicating a lab cluster's snapshots into a second region doubles the storage
  # footprint and the request cost for a stack destroyed at Phase 14, and the
  # recovery objective that matters here is "one snapshot is loadable", which
  # scripts/etcd-restore-drill.sh proves. A CRR decision belongs with a
  # multi-region decision, which SPEC.md lists as a non-goal.
  # https://docs.prismacloud.io/en/enterprise-edition/policy-reference/aws-policies/aws-general-policies/ensure-that-s3-bucket-has-cross-region-replication-enabled
  - CKV_AWS_144

  # Event notifications on the etcd snapshot bucket. The bucket's only reader is
  # scripts/etcd-restore-drill.sh, run by hand; there is no consumer that would
  # react to an SNS event, and wiring one would add a topic, a policy and a
  # subscription for a message nobody handles. The meaningful alert is "a snapshot
  # that was expected is not there", which scripts/doctor.sh already reports from
  # the Kubernetes API (ETCDSnapshotFile objects) without a second event bus.
  # https://docs.prismacloud.io/en/enterprise-edition/policy-reference/aws-policies/aws-logging-policies/bc-aws-2-62
  - CKV2_AWS_62

  # The http target group is HTTP by design: the ALB forwards to the Traefik
  # NodePort on plaintext, and the in-cluster second layer terminates TLS and
  # forces the upgrade through its redirectScheme middleware. Egress to that
  # port is restricted to the node internal security group, so the plaintext
  # hop never crosses the VPC. The https target group carries the real traffic.
  # https://docs.prismacloud.io/en/enterprise-edition/policy-reference/aws-policies/aws-networking-policies/ensure-aws-load-balancer-doesnt-use-http-protocol
  - CKV_AWS_378

  # CloudWatch retention of one year. The WAF log group is set to 14 days by
  # design: this platform is destroyed at Phase 14 inside a 43-day window, and
  # CloudWatch Logs retention is billed per GB ingested and stored, so a year of
  # sampled WAF requests is money spent on a history that will never be read.
  # The S3 access-log bucket keeps 30 days for the same reason. The incident
  # window an operator actually needs is the days around the incident, and the
  # value is a variable (log_retention_days) precisely so a long-lived
  # deployment sets it to 365 without editing the stack.
  # https://docs.prismacloud.io/en/enterprise-edition/policy-reference/aws-policies/aws-logging-policies/aws-cloudwatch-log-group-retention-period-365-days
  - CKV_AWS_338

  # Log4j AMR coverage, CKV_AWS_192 and CKV2_AWS_76. Both scanners look for a
  # rule that references the Log4j AWS managed rule group BY NAME. AWS does not
  # ship a separate Log4j rule group; the Log4JRCE_BODY/HEADER/QUERYSTRING/
  # URIPATH rules live inside AWSManagedRulesKnownBadInputsRuleSet, which this
  # ACL already attaches (verified for this account with
  # `aws wafv2 describe-managed-rule-group --name AWSManagedRulesKnownBadInputsRuleSet`).
  # The `log4j-coverage` rule at priority 15 exists so that group has its own
  # CloudWatch metric and the coverage is attributable. Suppressing rather than
  # inventing a managed group name that would fail at apply time.

  # Log4j AMR coverage, CKV_AWS_192 and CKV2_AWS_76. Both scanners look for a
  # rule that references a Log4j AWS managed rule group BY NAME. AWS ships no
  # separate Log4j group: the Log4JRCE_BODY / Log4JRCE_HEADER /
  # Log4JRCE_QUERYSTRING / Log4JRCE_URIPATH rules live INSIDE
  # AWSManagedRulesKnownBadInputsRuleSet, which this ACL already attaches, and
  # which this account actually provides -- verified 2026-10-09 with
  # `aws wafv2 describe-managed-rule-group --scope REGIONAL --vendor-name AWS \
  #   --name AWSManagedRulesKnownBadInputsRuleSet`.
  # The `log4j-coverage` rule at priority 15 exists so that group has its own
  # CloudWatch metric and the coverage is attributable to the Log4j rules rather
  # than the rest of the known-bad-inputs set. Suppressed rather than inventing
  # a managed rule group name that would fail at apply.
  - CKV_AWS_192
  - CKV2_AWS_76
  # ALB deletion protection. It is disabled by design and expressed as a variable
  # (var.alb_deletion_protection, default false) so a long-lived deployment sets
  # it true without editing the stack. The reason is Phase 14: teardown is driven
  # by a budget alarm, and a protected load balancer turns `terraform destroy`
  # into a two-step manual operation at the exact moment the operator is trying
  # to stop a spend. A checker that reads `enable_deletion_protection = false`
  # cannot see that the value is a knob; the knob is the artifact.
  # https://docs.prismacloud.io/en/enterprise-edition/policy-reference/aws-general-policies/bc-aws-150
  - CKV_AWS_150
