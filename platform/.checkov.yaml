# Checkov configuration for the platform/ stack.
#
# Checks are suppressed only where the finding is a false positive for this
# stack or a deliberate, priced deviation, and every line names its reason.
# Nothing here is a bare skip. Checkov loads exactly one config per run: this
# file when it scans this directory (`checkov -d platform`), and scripts/check.sh
# runs it that way so this list never leaks into the bootstrap/ scan.
#
# Rule of the file: a real defect found by checkov gets fixed in the .tf, not
# added here. CKV2_AWS_12 (the VPC default security group leaving all-traffic
# rules in place) was that case, and it is now fixed with an
# aws_default_security_group resource instead of a skip.

skip-check:
  # The SSM agent's own actions (ssm:UpdateInstanceInformation, ssmmessages:*,
  # ec2messages:Get*), ecr:GetAuthorizationToken and cloudwatch:PutMetricData all
  # have to be granted on "*" because AWS does not support resource-level
  # permissions for them. Evidence, from this account, 2026-10-09:
  # `aws iam get-policy-version --policy-arn arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore --version-id v2`
  # returns three statements and all three carry "Resource": "*". Narrowing the
  # ARN here would not tighten the role, it would deny the agent at runtime.
  # Read https://docs.aws.amazon.com/service-authorization/latest/reference/list_awssecuritytokenmessagingservice.html
  # and the SSM/CloudWatch equivalents: none of these actions take a resource ARN.
  - CKV_AWS_111
  - CKV_AWS_356

  # Port 80 on the edge group is the public entry point by design. SPEC trust
  # boundary 1 puts the ALB and its Web ACL in front of it, and the HTTP listener
  # only ever redirects to https; the port has to be reachable for that to work.
  # https://docs.prismacloud.io/en/enterprise-edition/policy-reference/aws-policies/aws-networking-policies/ensure-aws-security-groups-do-not-allow-ingress-from-00000-to-port-80
  - CKV_AWS_260

  # map_public_ip_on_launch = true is the cost decision, stated in vpc.tf: the
  # account has no NAT gateway budget, so nodes with a public IP and narrow
  # security groups are cheaper and tighter than private nodes behind a NAT.
  # https://docs.prismacloud.io/en/enterprise-edition/policy-reference/aws-policies/aws-networking-policies/ensure-vpc-subnets-do-not-assign-public-ip-by-default
  - CKV_AWS_130

  # The parameter holds the public k3s release channel ("stable"), not a secret:
  # SecureString would hide a string that is printed in every k3s release note.
  # The node role reads this one parameter only.
  - CKV2_AWS_34

  # The groups are created in the network phase and attached to instances in
  # ROADMAP Phase 3, which is a deliberate split: the network and the node
  # identity are reviewed separately, so there is no instance to attach to yet.
  # https://docs.prismacloud.io/en/enterprise-edition/policy-reference/aws-policies/aws-networking-policies/ensure-that-security-groups-are-attached-to-ec2-instances-or-elastic-network-interfaces-enis
  - CKV2_AWS_5

  # VPC flow logs are not enabled, and this is a real omission rather than a
  # false positive. They cost $0.50 per GB ingested in CloudWatch Logs against a
  # $30/month budget that the SPEC has already allocated, and the security story
  # here is proven by the security group rules themselves -- the Phase 3
  # acceptance criterion is `aws ec2 describe-security-groups` showing no 22/tcp,
  # which this stack makes literally true. Packet-flow evidence is the next
  # thing to add when a phase needs it; recorded here rather than passed over.
  # https://docs.prismacloud.io/en/enterprise-edition/policy-reference/aws-policies/aws-logging-policies/logging-9-enable-vpc-flow-logging
  - CKV2_AWS_11
