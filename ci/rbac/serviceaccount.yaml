# ===========================================================================
# ci RBAC, Phase 7 -- the identity Jenkins runs under.
#
# WHY THIS IS NOT THE CHART'S RBAC
# ---------------------------------------------------------------------------
# `jenkins.rbac.create: false` and `jenkins.serviceAccount.create: false` in
# ci/jenkins/values.yaml. With those on, the chart renders two Roles and two
# RoleBindings (`<release>-schedule-agents`, `<release>-casc-reload`, plus a
# secrets role and an OpenShift SCC role behind their own switches) with names
# derived from the release, in a template that only conftest can see when the
# rendered output is fed to it. With them off, the whole identity is this
# directory: three objects, kubeconform-checked as files, conftest-checked as
# files, and reviewable as a diff rather than as `helm template | grep`.
#
# The rules below are the union of the chart's own two Roles -- nothing is
# removed and nothing is invented -- so the permissions are the ones upstream
# Jenkins was tested with, stated per verb instead of hidden in a template.
#
# APPLY ORDER
# ---------------------------------------------------------------------------
# These are plain manifests, not Helm resources: apply them before
# `helm install`, or the StatefulSet pod comes up in ContainerCreating with
# FailedMount events for a ServiceAccount that does not exist yet. The runbook
# (docs/runbooks/ci.md) carries the order; nothing here fails safe by itself.
# ===========================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: ci
  labels:
    app.kubernetes.io/part-of: boutique-platform
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: jenkins-controller
    boutique.io/rbac-tier: platform
# automountServiceAccountToken is deliberately left at its default (true): this
# ServiceAccount exists precisely so the controller can talk to the API server
# to schedule agent pods. Setting it to false here would silently break the
# Kubernetes plugin while looking like a hardening win.
