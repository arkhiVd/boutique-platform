# ===========================================================================
# The ServiceAccount agent pods run under, namespace `ci`.
#
# Separate from the controller's `jenkins` ServiceAccount on purpose. The
# controller creates and deletes pods; an agent executes build code, and build
# code that can create and delete pods has a lateral-movement path into every
# other workload in the namespace. Two identities, two Roles, and the agent's
# rights live in ci/rbac/agent-deploy-rolebinding.yaml where the blast radius
# is the namespace it deploys to.
#
# CI value referenced as `agent.serviceAccount: jenkins-agent` in
# ci/jenkins/values.yaml. Without that line the chart leaves the agent pod's
# `serviceAccount` at `default` -- which is what it renders today if the value
# is omitted -- and the policy in policy/security.rego rule 10 exists to reject
# exactly that.
# ===========================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-agent
  namespace: ci
  labels:
    app.kubernetes.io/part-of: boutique-platform
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: jenkins-agent
    boutique.io/rbac-tier: platform
# automountServiceAccountToken stays on: this token is what the pipelines use
# when they call the API through kubectl (see pipelines/vars/*.groovy, which
# runs kubectl inside the agent's own dind container against the projected
# token at /var/run/secrets/kubernetes.io/serviceaccount).
